<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Variante B: Ein kräftiges O, durch das ein Haken nach oben rechts hinausschwingt –
       Aufgaben erledigen, Fortschritt, nach vorne gerichtet (Roadmap). -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#111111" stroke-width="104"/>
  <!-- weißer Rand trennt Haken und Ring -->
  <polyline points="372,520 476,624 806,262" fill="none" stroke="#FFFFFF" stroke-width="128"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="372,520 476,624 806,262" fill="none" stroke="#111111" stroke-width="72"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
